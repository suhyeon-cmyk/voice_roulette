<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#D81159"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="100%" stop-color="#D81159"/>
    </linearGradient>
    <!-- Soft Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FF3366" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rim Shadow & Outer Ring -->
  <circle cx="64" cy="69" r="52" fill="#FFFFFF" stroke="url(#rim)" stroke-width="4.5" filter="url(#softGlow)"/>

  <!-- 6 Roulette Wedges -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
    <!-- Wedge 1: -90 to -30 deg -->
    <path d="M 64 69 L 64 19.5 A 49.5 49.5 0 0 1 106.87 44.25 Z" fill="#FFA5B9"/>
    <!-- Wedge 2: -30 to 30 deg -->
    <path d="M 64 69 L 106.87 44.25 A 49.5 49.5 0 0 1 106.87 93.75 Z" fill="#BA68C8"/>
    <!-- Wedge 3: 30 to 90 deg -->
    <path d="M 64 69 L 106.87 93.75 A 49.5 49.5 0 0 1 64 118.5 Z" fill="#FFCCD5"/>
    <!-- Wedge 4: 90 to 150 deg -->
    <path d="M 64 69 L 64 118.5 A 49.5 49.5 0 0 1 21.13 93.75 Z" fill="#FF5D8F"/>
    <!-- Wedge 5: 150 to 210 deg -->
    <path d="M 64 69 L 21.13 93.75 A 49.5 49.5 0 0 1 21.13 44.25 Z" fill="#CE93D8"/>
    <!-- Wedge 6: 210 to 270 deg -->
    <path d="M 64 69 L 21.13 44.25 A 49.5 49.5 0 0 1 64 19.5 Z" fill="#FF3366"/>
  </g>

  <!-- Decorative Rim Dots -->
  <g fill="#FFFFFF">
    <circle cx="64" cy="21" r="1.8"/>
    <circle cx="105.5" cy="45" r="1.8"/>
    <circle cx="105.5" cy="93" r="1.8"/>
    <circle cx="64" cy="117" r="1.8"/>
    <circle cx="22.5" cy="93" r="1.8"/>
    <circle cx="22.5" cy="45" r="1.8"/>
  </g>

  <!-- Center Circle Hub -->
  <circle cx="64" cy="69" r="21" fill="#FFFFFF" stroke="#FFB3C1" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Center Heart -->
  <path d="M 64 78 C 64 78, 51 70, 51 62.5 C 51 57.5, 54.5 54, 58.5 54 C 61.2 54, 63.1 55.3, 64 56.8 C 64.9 55.3, 66.8 54, 69.5 54 C 73.5 54, 77 57.5, 77 62.5 C 77 70, 64 78, 64 78 Z" fill="url(#heartGrad)"/>
  <!-- Heart Specular Highlight -->
  <circle cx="57.5" cy="58.5" r="1.8" fill="#FFA5B9" opacity="0.8"/>

  <!-- Top Heart Pin Indicator -->
  <g filter="url(#shadow)">
    <path d="M 64 25 L 53.5 13.5 C 51.5 10 52.5 5 57.5 4 C 61 3.5 63 5.2 64 7 C 65 5.2 67 3.5 70.5 4 C 75.5 5 76.5 10 74.5 13.5 Z" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="64" cy="9.5" r="2" fill="#FFFFFF"/>
  </g>
</svg>
